# Documentation of the judgment crate, apart from signalman's (decision 0011).
# Builds as TechDocs for the `judgment` Component in the root catalog-info.yaml
# (backstage.io/techdocs-ref: dir:./crates/judgment), and is the nav
# scripts/gen-llms-txt.sh reads to write docs/llms.txt and docs/llms-full.txt.
# The pages carry YAML frontmatter; mkdocs reads it as page meta.
site_name: judgment
site_description: Typed, calibrated judgments from TypeSafe System One models (Jev) and compatible backends, as a Rust crate.
repo_url: https://github.com/chussenot/signalman
edit_uri: edit/main/crates/judgment/docs/
docs_dir: docs

nav:
  - Overview: index.md
  - How judgment works: design.md
  - Verification:
      - Against the hosted TypeSafe API: verification/hosted-typesafe.md
      - Against Laya typed-decisions: verification/laya-typed-decisions.md
  - Research:
      - System One client libraries: research/system-one-client-libraries.md
  - Decisions:
      - Index: decisions/README.md
      - 0003 Typed handles between questions and answers: decisions/0003-typed-handles-between-questions-and-answers.md

plugins:
  - techdocs-core

# Mermaid fences render in GitHub natively; in Backstage they need the TechDocs
# Mermaid addon, as for signalman's documentation.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
