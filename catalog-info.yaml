# Backstage catalog entries for signalman and its judgment crate. Register
# this file's URL in the catalog (or via the GitHub discovery provider) and the
# service, the library, their TechDocs (docs/ and crates/judgment/docs/) and
# their dependencies show up in the portal.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: signalman
  title: signalman
  description: >-
    Alert triage that turns calibrated TypeSafe judgments into routing
    decisions inside incident.io, using the software catalog as the
    ownership source of truth.
  tags:
    - rust
    - alerting
    - incident-response
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: chussenot/signalman
  links:
    - url: https://github.com/chussenot/signalman
      title: Repository
      icon: github
    - url: https://docs.typesafe.ai
      title: TypeSafe docs
      icon: docs
spec:
  type: service
  lifecycle: experimental
  # Replace with the group that operates signalman in your catalog.
  owner: group:default/platform-engineering
  dependsOn:
    - component:default/judgment
    - resource:default/incident-io
    - resource:default/typesafe-api
  # Registered so alert routes and this service can be traced from one another.
  consumesApis: []
---
# The typed TypeSafe client, a workspace member published apart from the
# application (decision 0010), with its own documentation set (decision 0011)
# built by crates/judgment/mkdocs.yml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: judgment
  title: judgment
  description: >-
    Rust crate for typed, calibrated judgments from TypeSafe System One
    models (Jev) and compatible backends: typed questions and answers, the
    HTTP client with SDK-default retries, record and replay, evaluation.
  tags:
    - rust
    - library
  annotations:
    backstage.io/techdocs-ref: dir:./crates/judgment
    github.com/project-slug: chussenot/signalman
  links:
    - url: https://github.com/chussenot/signalman/tree/main/crates/judgment
      title: Source
      icon: github
spec:
  type: library
  lifecycle: experimental
  # Replace with the group that operates signalman in your catalog.
  owner: group:default/platform-engineering
  dependsOn:
    - resource:default/typesafe-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: incident-io
  description: incident.io SaaS, the alert and incident hub signalman writes tags and attachments to.
  links:
    - url: https://api-docs.incident.io
      title: API reference
spec:
  type: saas
  owner: group:default/platform-engineering
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: typesafe-api
  description: TypeSafe System One API (Jev), the decision model signalman asks.
  links:
    - url: https://docs.typesafe.ai
      title: Documentation
spec:
  type: saas
  owner: group:default/platform-engineering
