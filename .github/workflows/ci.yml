name: CI

# Only GitHub-owned actions are used (actions/checkout, actions/cache). The
# toolchain comes from rust-toolchain.toml via rustup, and prek is installed
# with pipx, so the workflow runs under a repository policy that forbids
# third-party actions.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # The judgment crate must build without its `http` feature, for a
      # project that brings its own transport; its tests are checked too.
      - run: cargo check -p judgment --no-default-features --all-targets
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-frontmatter.sh README.md docs
      - run: scripts/gen-llms-txt.sh --check

  hooks:
    name: pre-commit hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prek
        run: |
          pipx install prek
          prek --version

      # The cargo hooks already run in the check job; no-commit-to-branch is
      # meaningless on a CI checkout of main.
      - name: Run hooks on all files
        run: prek run --all-files --hook-stage pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy,no-commit-to-branch

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag "$IMAGE:${GITHUB_SHA::12}" .

      - name: Smoke test the runtime image
        run: docker run --rm "$IMAGE:${GITHUB_SHA::12}" --version

      # A tag v1.2.3 publishes :1.2.3 and :latest; pull requests and pushes
      # to main only prove the image builds. Plain docker, no third-party
      # action, for the same repository policy as the other jobs.
      - name: Publish on a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${GITHUB_SHA::12}" "$IMAGE:${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE:${GITHUB_SHA::12}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          docker push "$IMAGE:latest"
