name: CI

# Only GitHub-owned actions are used (actions/checkout, actions/cache). The
# toolchain comes from rust-toolchain.toml via rustup, and prek is installed
# with pipx, so the workflow runs under a repository policy that forbids
# third-party actions.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, doc, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: scripts/check-frontmatter.sh README.md docs

  hooks:
    name: pre-commit hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install prek
        run: |
          pipx install prek
          prek --version

      # The cargo hooks already run in the check job; no-commit-to-branch is
      # meaningless on a CI checkout of main.
      - name: Run hooks on all files
        run: prek run --all-files --hook-stage pre-commit
        env:
          SKIP: cargo-fmt,cargo-clippy,no-commit-to-branch
