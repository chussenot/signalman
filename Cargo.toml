[package]
name = "signalman"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
description = "Typed Rust client for the TypeSafe System One API, with an alert-triage example"
license = "MIT"
publish = false

[[bin]]
name = "signalman"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1"], default-features = false }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
hmac = "0.12"
jiff = { version = "0.2", default-features = false, features = ["std"] }
schemars = "1.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset"] }
# MCP server (decision 0008): the server macros, the stdio transport, and the
# Streamable HTTP server as a tower service mounted on the axum router. No
# client, no OAuth extras. The client features live under dev-dependencies
# only, for in-process and over-HTTP tests — they never reach the binary.
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net", "signal", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# OpenTelemetry (signalman-m28.2): spans over the triage flow and metrics for
# the receiver, exported over OTLP/HTTP (protobuf) through the reqwest this
# crate already ships, only when an endpoint is configured. No gRPC stack and
# no OTel logs signal: `tracing` text logs stay on stderr. tracing-opentelemetry
# numbers its releases one ahead of the opentelemetry crates it depends on.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "internal-logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
jsonschema = { version = "0.57", default-features = false }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
