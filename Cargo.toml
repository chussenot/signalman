[package]
name = "rustsafe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Type-safe HTTP API in Rust: parse-don't-validate newtypes, typestate lifecycles, and an OpenAPI contract derived from the types"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
# Handler errors are documented per status code in the `#[utoipa::path]` responses.
missing_errors_doc = "allow"
must_use_candidate = "allow"
