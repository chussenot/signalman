# signalman configuration file (TOML).
#
# Every key is optional. Precedence, lowest to highest: built-in default,
# this file, environment variable, command-line flag. Secrets are never read
# from this file: TYPESAFE_API_KEY, INCIDENTIO_API_KEY, INCIDENTIO_WEBHOOK_SECRET
# and BACKSTAGE_TOKEN come from the environment (a Kubernetes Secret).
#
# `signalman config show --config examples/config/signalman.toml` prints the
# effective result. Unknown keys are rejected at start-up.

[server]
addr = "0.0.0.0:8080"                 # SIGNALMAN_ADDR, --addr
readiness_cache_seconds = 30           # SIGNALMAN_READINESS_CACHE_SECONDS; how long GET /readyz reuses its last check, 0 checks every time
readiness_timeout_seconds = 3          # SIGNALMAN_READINESS_TIMEOUT_SECONDS; per-upstream deadline of one check

[typesafe]
# base_url = "https://api.typesafe.ai" # TYPESAFE_BASE_URL
model = "jev-latest"                   # TYPESAFE_DEFAULT_MODEL, --model; pin a version once tuned
timeout_seconds = 10                   # TYPESAFE_TIMEOUT_SECONDS

[incidentio]
# base_url = "https://api.incident.io" # INCIDENTIO_BASE_URL
max_candidates = 40                    # SIGNALMAN_MAX_CANDIDATES; open incidents offered for dedup
# alert_source_config_id = "01GW…"     # INCIDENTIO_ALERT_SOURCE_CONFIG_ID; HTTP alert source for triage --forward-to-incidentio

[backstage]
# Setting base_url turns catalog enrichment on.
base_url = "https://backstage-backend.example.com"   # BACKSTAGE_BASE_URL
app_url = "https://backstage.example.com"            # BACKSTAGE_APP_URL; links in the note
namespace = "default"                                # BACKSTAGE_NAMESPACE
group_types = ["team"]                               # BACKSTAGE_GROUP_TYPES; spec.type of groups offered as owners
component_keys = ["component", "service", "app", "application", "Service", "Component"]  # SIGNALMAN_COMPONENT_KEYS
notify = false                                       # BACKSTAGE_NOTIFY, --notify-owners

[flow]
note = true                            # SIGNALMAN_NOTE, --no-note
related_window_minutes = 30            # SIGNALMAN_RELATED_WINDOW_MINUTES, --related-window-minutes; 0 disables
related_max = 20                       # SIGNALMAN_RELATED_MAX

# The MCP server (decision 0008). `serve` mounts /mcp whenever SIGNALMAN_MCP_TOKEN
# is set; `signalman mcp` serves it alone, over stdio or HTTP.
[mcp]
enabled = true                         # SIGNALMAN_MCP_ENABLED; kill switch
transport = "stdio"                    # SIGNALMAN_MCP_TRANSPORT; "stdio" or "http", for `signalman mcp`
# bind_address = "0.0.0.0:8081"        # SIGNALMAN_MCP_BIND_ADDRESS; required by `signalman mcp` with "http"
# allowed_hosts = ["signalman.example.com"]  # SIGNALMAN_MCP_ALLOWED_HOSTS; Host header check, empty disables
allow_write = false                    # SIGNALMAN_MCP_ALLOW_WRITE; registers apply_qualification

# OpenTelemetry. Spans and metrics are exported over OTLP/HTTP only when an
# endpoint is set; the text log on stderr is always there. A collector that
# needs a token takes it from OTEL_EXPORTER_OTLP_HEADERS (environment only).
[telemetry]
# otlp_endpoint = "http://otel-collector.observability.svc:4318"  # OTEL_EXPORTER_OTLP_ENDPOINT
service_name = "signalman"             # OTEL_SERVICE_NAME
metrics_interval_seconds = 60          # SIGNALMAN_METRICS_INTERVAL_SECONDS

# Question wording and routing thresholds. File only, no variable; default:
# the built-in rubric. The words of every question, when each is asked, and
# the thresholds the decision reads are a rubric in the judgment crate's .jud
# format (jud 1.1): a YAML file with each question in the shape TypeSafe
# receives, in the order the model sees them, and a `policy` of gates.
# `signalman config rubric > triage.jud` writes the built-in one beside this
# file; edit it and name it here (a relative path is relative to this file).
# The set of questions and their types are code, and impact keeps exactly
# four levels, lowest first. A change to a question changes the question
# fingerprint a recorded evaluation run is replayed against; a change to a
# threshold does not (docs/evaluation.md). [triage.text] and [policy] were
# replaced by this; `config show` prints the thresholds in effect.
[triage]
# rubric = "triage.jud"

# Fallback owner candidates when no catalog is configured or nothing matched.
# Replaces the built-in list entirely. `none_of_these` is appended automatically.
# Uncomment to replace the built-in list; a custom list cannot replay the committed
# runs under examples/eval/runs, which were recorded against the built-in team keys.
# [[triage.teams]]
# key = "platform"
# label = "Platform"
# description = "Kubernetes, cluster add-ons, CI/CD, internal developer platform, cloud accounts and quotas"
#
# [[triage.teams]]
# key = "application"
# label = "Application"
# description = "A product service's own code or configuration: errors, latency, business logic"
