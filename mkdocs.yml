# TechDocs build for the signalman Component (backstage.io/techdocs-ref: dir:.).
# The pages under docs/ carry YAML frontmatter; mkdocs reads it as page meta.
site_name: signalman
site_description: Alert triage with calibrated judgments, incident.io and the Backstage catalog.
repo_url: https://github.com/chussenot/rustsafe
edit_uri: edit/main/docs/
docs_dir: docs

nav:
  - Overview: index.md
  - Architecture:
      - Overview: architecture.md
      - C4 context: c4/context.md
      - C4 containers: c4/container.md
      - C4 components: c4/component.md
  - Backstage bridge: backstage.md
  - TypeSafe client: typesafe-client.md
  - Laya as a model provider: laya.md
  - Triage: triage.md
  - Evaluation harness: evaluation.md
  - incident.io integration: incidentio.md
  - Change feed: changes.md
  - MCP server: mcp.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Development: development.md
  - Roadmap: roadmap.md
  - Decisions:
      - Index: decisions/README.md
      - 0001 incident.io remains the alert hub: decisions/0001-incidentio-remains-the-alert-hub.md
      - 0002 Calibrated judgments over generated text: decisions/0002-calibrated-judgments-over-generated-text.md
      - 0003 Typed handles between questions and answers: decisions/0003-typed-handles-between-questions-and-answers.md
      - 0004 The catalog is the ownership source of truth: decisions/0004-catalog-is-the-ownership-source-of-truth.md
      - 0005 Observability signals enter through incident.io: decisions/0005-observability-signals-enter-through-incidentio.md
      - 0006 Layered configuration with secrets outside the file: decisions/0006-layered-configuration.md
      - 0007 Changes are pushed, not polled: decisions/0007-changes-are-pushed-not-polled.md
      - 0008 signalman is a tool for agents, not an agent: decisions/0008-signalman-is-a-tool-for-agents.md
      - Template: decisions/template.md

plugins:
  - techdocs-core

# Mermaid fences render in GitHub natively. In Backstage they need the
# TechDocs Mermaid addon (backstage-plugin-techdocs-addon-mermaid) on the
# frontend; this fence definition keeps the blocks intact for it.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
